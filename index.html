<style>
  body {
    background: linear-gradient(135deg, #0e8f8a, #05a8ad, #1b2a6b, #000);
    min-height: 100vh;
    margin: 0;
    padding: 20px 12px 60px;
    font-family: "Lalezar", Tahoma, sans-serif;
    color: white;
  }

  .box {
    width: 90%;
    max-width: 480px;
    margin: 40px auto 0;
    padding: 32px 24px;
    text-align: center;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  }

  .box h2 {
    margin: 0 0 20px;
    font-size: 2rem;
    font-weight: 400;
  }

  .add {
    display: flex;
    gap: 10px;
  }

  .add input {
    flex: 1;
    min-width: 0;
    font-family: "Lalezar", Tahoma, sans-serif;
    font-size: 1.2rem;
    padding: 12px 18px;
    border: 3px solid transparent;
    border-radius: 999px;
    background: white;
    color: #12333a;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .add input:focus {
    border-color: #ffd166;
    box-shadow: 0 0 0 5px rgba(255, 209, 102, 0.4);
  }
  .add input:disabled {
    opacity: 0.5;
  }

  .add button {
    font-family: "Lalezar", Tahoma, sans-serif;
    font-size: 1.2rem;
    padding: 12px 24px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(135deg, #ffd166, #ff9f43);
    color: #3a2500;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .add button:hover:not(:disabled) { transform: scale(1.08); }
  .add button:active:not(:disabled) { transform: scale(0.95); }
  .add button:disabled { opacity: 0.5; cursor: default; }

  #names {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 26px 0 0;
    padding: 0;
    list-style: none;
  }

  #names li {
    padding: 8px 20px;
    font-size: 1.2rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
    border: 1px solid rgba(255, 255, 255, 0.5);
    animation: pop 0.4s ease;
  }

  #names li button {
    color: #ffd166;
  }

  @keyframes pop {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
</style>

<div class="box">
  <h2>اسمت را بنویس</h2>
  <div class="add">
    <input id="name" type="text" placeholder="مثلاً: علی…" maxlength="30">
    <button id="btn" type="button">ثبت ✨</button>
  </div>
  <ul id="names"></ul>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var list  = document.getElementById('names');
  var input = document.getElementById('name');
  var btn   = document.getElementById('btn');

  if (!list || !input || !btn) {
    console.error('پیدا نشد:', { names: list, name: input, btn: btn });
    return;
  }

  var KEY = 'saved-items';
  var items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  function render() {
    list.textContent = '';
    items.forEach(function (text, i) {
      var li = document.createElement('li');
      li.textContent = text;

      var del = document.createElement('button');
      del.type = 'button';
      del.textContent = ' ✕';
      del.title = 'پاک کردن';
      del.style.cssText = 'border:0;background:none;cursor:pointer;font:inherit;';
      del.addEventListener('click', function () {
        items.splice(i, 1);
        save();
        render();
      });

      li.appendChild(del);
      list.appendChild(li);
    });
  }

  function addItem() {
    var v = input.value.trim();
    if (!v) return;
    items.push(v);
    save();
    input.value = '';
    input.focus();
    render();
  }

  btn.addEventListener('click', addItem);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addItem();
  });

  render();
});
</script>

<style>
#names {
  max-width: 480px;
  margin: 24px auto 0;
}
</style>
